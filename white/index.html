<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Fractal Brushes Ink</title>
  <meta name="description" content="Fractal Brushes Ink is a desktop ink studio: eight ink brushes (sumi, hake, mop, reed pen, nib, dry bristle, flick, water drop), colored pigments, live wet blooms, mirrored symmetry, and PNG export.">
  <style>
    :root {
      color-scheme: light;
      --paper: oklch(97.5% 0.008 92);
      --paper-deep: oklch(93.5% 0.012 88);
      --surface: oklch(99% 0.006 92 / 0.9);
      --surface-strong: oklch(98% 0.007 92 / 0.97);
      --ink: oklch(16% 0.01 80);
      --muted: oklch(48% 0.012 78);
      --quiet: oklch(64% 0.012 78);
      --line: oklch(54% 0.016 78 / 0.2);
      --line-strong: oklch(34% 0.018 78 / 0.32);
      --active: oklch(48% 0.15 260);
      --active-soft: oklch(48% 0.15 260 / 0.12);
      --shadow: 0 22px 62px oklch(20% 0.018 80 / 0.18);
      --topbar-h: 56px;
      --rail-w: 236px;
      --side-w: 300px;
      --pig-deep: 16 15 12;
      --pig-wash: 76 74 68;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background: var(--paper);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-rendering: optimizeLegibility;
      overscroll-behavior: none;
    }

    body::before,
    body::after {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      content: "";
    }

    body::before {
      opacity: 0.36;
      background:
        radial-gradient(circle at 20% 18%, oklch(100% 0 0 / 0.68), transparent 28rem),
        radial-gradient(circle at 78% 82%, oklch(88% 0.014 78 / 0.62), transparent 32rem),
        linear-gradient(135deg, oklch(99% 0.006 92), var(--paper-deep));
    }

    body::after {
      opacity: 0.12;
      mix-blend-mode: multiply;
      background-image:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.78' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.24  0 0 0 0 0.21  0 0 0 0 0.16  0 0 0 0.72 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      background-size: 180px 180px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      color: inherit;
      font: inherit;
    }

    /* ---- Top bar ---------------------------------------------------- */

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 6;
      height: var(--topbar-h);
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto minmax(220px, 1fr);
      align-items: center;
      gap: 12px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      background: oklch(99% 0.006 92 / 0.88);
      box-shadow: 0 1px 14px oklch(25% 0.012 78 / 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      user-select: none;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      justify-self: start;
      gap: 11px;
      font-family: ui-serif, "Iowan Old Style", Baskerville, Georgia, serif;
      font-size: 20px;
      font-weight: 760;
    }

    .brand svg {
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
    }

    .tagline {
      justify-self: center;
      color: var(--quiet);
      font-size: 13px;
      font-weight: 620;
      letter-spacing: 0.02em;
    }

    .actions {
      display: flex;
      justify-self: end;
      align-items: center;
      gap: 7px;
    }

    .tool,
    .edge-button,
    .chip,
    .export {
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: oklch(99% 0.006 92 / 0.72);
      box-shadow: inset 0 1px 0 oklch(100% 0 0 / 0.72);
      cursor: pointer;
      appearance: none;
      transition:
        transform 150ms var(--ease-out),
        border-color 150ms var(--ease-out),
        background 150ms var(--ease-out),
        color 150ms var(--ease-out);
    }

    .tool,
    .export {
      min-width: 40px;
      min-height: 40px;
      display: inline-grid;
      place-items: center;
      padding: 0 11px;
      font-size: 13px;
      font-weight: 760;
    }

    .tool svg,
    .export svg {
      width: 18px;
      height: 18px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.9;
    }

    .export {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 15px;
      color: oklch(98% 0.008 92);
      border-color: oklch(18% 0.012 80 / 0.9);
      background: oklch(17% 0.012 80 / 0.96);
    }

    .tool:focus-visible,
    .brush:focus-visible,
    .edge-button:focus-visible,
    .chip:focus-visible,
    .export:focus-visible,
    a:focus-visible,
    input:focus-visible {
      outline: 3px solid oklch(58% 0.16 260 / 0.34);
      outline-offset: 3px;
    }

    .tool:active,
    .brush:active,
    .edge-button:active,
    .chip:active,
    .export:active {
      transform: scale(0.97);
    }

    .tool:disabled {
      cursor: not-allowed;
      color: oklch(60% 0.012 80 / 0.58);
      background: oklch(95% 0.006 90 / 0.54);
      transform: none;
      box-shadow: none;
    }

    /* ---- Docked columns --------------------------------------------- */

    .rail,
    .side {
      position: fixed;
      top: var(--topbar-h);
      bottom: 0;
      z-index: 4;
      overflow-y: auto;
      padding: 16px 14px 20px;
      background: var(--surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      user-select: none;
    }

    .rail {
      left: 0;
      width: var(--rail-w);
      border-right: 1px solid var(--line);
    }

    .side {
      right: 0;
      width: var(--side-w);
      display: grid;
      gap: 18px;
      align-content: start;
      border-left: 1px solid var(--line);
    }

    .section-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin: 0 2px 10px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 780;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .side .section-title {
      margin-bottom: 0;
    }

    .side section {
      display: grid;
      gap: 9px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .side section:last-of-type {
      padding-bottom: 0;
      border-bottom: 0;
    }

    /* ---- Brush rail -------------------------------------------------- */

    .brush-list {
      display: grid;
      gap: 8px;
    }

    .brush {
      display: grid;
      gap: 5px;
      padding: 7px 9px 8px;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: oklch(99% 0.006 92 / 0.72);
      box-shadow: inset 0 1px 0 oklch(100% 0 0 / 0.72);
      cursor: pointer;
      appearance: none;
      transition:
        transform 150ms var(--ease-out),
        border-color 150ms var(--ease-out),
        background 150ms var(--ease-out),
        box-shadow 150ms var(--ease-out);
    }

    .brush[aria-pressed="true"] {
      border-color: var(--active);
      background: oklch(96% 0.02 260 / 0.72);
      box-shadow: 0 0 0 3px var(--active-soft);
    }

    .brush-preview {
      width: 100%;
      height: 34px;
      display: block;
      border-radius: 6px;
      background:
        radial-gradient(circle at 30% 30%, oklch(100% 0 0 / 0.5), transparent 60%),
        oklch(98% 0.007 90);
      box-shadow: inset 0 0 0 1px oklch(54% 0.016 78 / 0.12);
    }

    .brush-caption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brush-name {
      display: grid;
      gap: 1px;
      font-size: 13px;
      font-weight: 720;
      line-height: 1.15;
    }

    .brush-name em {
      color: var(--quiet);
      font-size: 11px;
      font-style: normal;
      font-weight: 620;
      white-space: nowrap;
    }

    .brush kbd {
      flex: 0 0 auto;
      min-width: 20px;
      padding: 2px 5px;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      color: var(--muted);
      background: oklch(97% 0.007 90);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
    }

    .brush[aria-pressed="true"] kbd {
      color: var(--active);
      border-color: var(--active);
    }

    .rail-foot {
      margin-top: 14px;
      color: var(--quiet);
      font-size: 11px;
      font-weight: 620;
      text-align: center;
    }

    /* ---- Settings column --------------------------------------------- */

    .field {
      display: grid;
      gap: 7px;
    }

    .field-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      font-weight: 680;
    }

    .value {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      font-weight: 700;
    }

    input[type="range"] {
      width: 100%;
      height: 26px;
      margin: 0;
      accent-color: var(--active);
      background: transparent;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, oklch(72% 0.012 78 / 0.38), var(--active));
    }

    input[type="range"]::-webkit-slider-thumb {
      width: 18px;
      height: 18px;
      margin-top: -7px;
      border: 2px solid oklch(99% 0.006 92);
      border-radius: 50%;
      background: var(--active);
      box-shadow: 0 2px 12px oklch(34% 0.018 78 / 0.2);
      appearance: none;
    }

    .pigment-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
    }

    .pigment {
      width: 100%;
      height: 34px;
      padding: 0;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      cursor: pointer;
      appearance: none;
      box-shadow: inset 0 1px 0 oklch(100% 0 0 / 0.22);
      transition:
        transform 150ms var(--ease-out),
        border-color 150ms var(--ease-out),
        box-shadow 150ms var(--ease-out);
    }

    .pigment[aria-pressed="true"] {
      border-color: var(--active);
      box-shadow: 0 0 0 3px var(--active-soft), inset 0 1px 0 oklch(100% 0 0 / 0.22);
    }

    .pigment:active {
      transform: scale(0.94);
    }

    input.pigment-custom {
      background: conic-gradient(oklch(62% 0.21 20), oklch(78% 0.16 90), oklch(66% 0.17 150), oklch(60% 0.16 230), oklch(56% 0.2 300), oklch(62% 0.21 20));
    }

    input.pigment-custom::-webkit-color-swatch-wrapper {
      padding: 4px;
    }

    input.pigment-custom::-webkit-color-swatch {
      border: 0;
      border-radius: 4px;
    }

    .edge-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .edge-button {
      min-height: 36px;
      display: grid;
      place-items: center;
      padding: 0;
    }

    .edge-button[aria-pressed="true"] {
      color: var(--active);
      border-color: var(--active);
      background: var(--active-soft);
    }

    .edge-button svg {
      width: 26px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-width: 1.8;
    }

    .chip-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .chip {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 10px;
      font-size: 13px;
      font-weight: 720;
    }

    .chip svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.9;
    }

    .chip[aria-pressed="true"] {
      color: var(--active);
      border-color: var(--active);
      background: var(--active-soft);
    }

    /* ---- Stage -------------------------------------------------------- */

    #stage {
      position: fixed;
      top: var(--topbar-h);
      right: var(--side-w);
      bottom: 0;
      left: var(--rail-w);
      z-index: 1;
      overflow: hidden;
      cursor: crosshair;
      touch-action: none;
    }

    canvas#art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .hints {
      position: absolute;
      left: 50%;
      bottom: 14px;
      z-index: 2;
      padding: 7px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--quiet);
      background: oklch(99% 0.006 92 / 0.78);
      font-size: 11.5px;
      font-weight: 640;
      white-space: nowrap;
      transform: translateX(-50%);
      pointer-events: none;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .hints kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10.5px;
      color: var(--muted);
    }

    .status {
      position: fixed;
      left: calc(50vw - (var(--side-w) - var(--rail-w)) / 2);
      bottom: 56px;
      z-index: 5;
      max-width: min(460px, 60vw);
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: var(--surface-strong);
      box-shadow: var(--shadow);
      font-size: 12px;
      font-weight: 680;
      text-align: center;
      transform: translateX(-50%);
      user-select: none;
    }

    .status[hidden] {
      display: none;
    }

    @media (hover: hover) and (pointer: fine) {
      .pigment:hover {
        border-color: var(--active);
      }

      .tool:hover,
      .brush:hover,
      .edge-button:hover,
      .chip:hover {
        color: var(--active);
        border-color: oklch(48% 0.15 260 / 0.32);
        background: var(--active-soft);
      }

      .export:hover {
        color: oklch(98% 0.008 92);
        background: oklch(23% 0.012 80 / 0.98);
      }
    }

    @media (max-width: 1060px) {
      :root {
        --rail-w: 208px;
        --side-w: 264px;
      }

      .tagline {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 1ms !important;
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <header class="topbar" aria-label="Ink studio controls">
    <a class="brand" href="../" aria-label="Fractal Brushes home">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.28"/>
        <path d="M16 4.5c0 6.2-6.5 7.4-10.1 11.5C9.5 20.1 16 21.3 16 27.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <path d="M16 4.5c0 6.2 6.5 7.4 10.1 11.5C22.5 20.1 16 21.3 16 27.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <circle cx="16" cy="16" r="2.2" fill="currentColor"/>
      </svg>
      <span>Fractal Brushes Ink</span>
    </a>

    <div class="tagline">Eight ink brushes · liquid pigment on paper</div>

    <div class="actions">
      <button class="tool" id="undo" type="button" aria-label="Undo" title="Undo (Cmd/Ctrl+Z)" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7H4v5"/><path d="M5 12a8 8 0 1 0 2.35-5.65L4 9.7"/></svg>
      </button>
      <button class="tool" id="redo" type="button" aria-label="Redo" title="Redo (Cmd/Ctrl+Shift+Z)" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 7h5v5"/><path d="M19 12a8 8 0 1 1-2.35-5.65L20 9.7"/></svg>
      </button>
      <button class="tool" id="clear" type="button" aria-label="Clear" title="Clear (C)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg>
      </button>
      <button class="export" id="export" type="button" aria-label="Export PNG" title="Export PNG (P)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11"/><path d="m7 9 5 5 5-5"/><path d="M5 19h14"/></svg>
        <span>Export PNG</span>
      </button>
    </div>
  </header>

  <aside class="rail" aria-label="Ink brushes">
    <div class="section-title"><span>Brushes</span></div>
    <div class="brush-list" id="brushList"></div>
    <div class="rail-foot">Press 1–8 to switch brushes</div>
  </aside>

  <main id="stage" aria-label="Fractal Brushes Ink drawing surface">
    <canvas id="art" aria-label="Fractal Brushes Ink drawing canvas"></canvas>
    <div class="hints" aria-hidden="true">
      <kbd>1–8</kbd> brushes &nbsp;·&nbsp; <kbd>[</kbd><kbd>]</kbd> size &nbsp;·&nbsp; <kbd>M</kbd> mirror &nbsp;·&nbsp; <kbd>⌘Z</kbd> undo &nbsp;·&nbsp; <kbd>C</kbd> clear &nbsp;·&nbsp; <kbd>P</kbd> export
    </div>
  </main>

  <aside class="side" id="settingsPanel" aria-label="Ink settings">
    <section>
      <div class="section-title"><span>Pigment</span><span class="value" id="pigmentValue">Sumi Black</span></div>
      <div class="pigment-row" id="pigmentRow" role="group" aria-label="Ink color"></div>
    </section>

    <section>
      <div class="section-title"><span>Ink mix</span></div>
      <label class="field">
        <span class="field-head"><span>Ink density</span><span class="value" id="densityValue">62%</span></span>
        <input id="density" type="range" min="18" max="100" value="62" aria-label="Ink density">
      </label>
      <label class="field">
        <span class="field-head"><span>Water</span><span class="value" id="waterValue">38%</span></span>
        <input id="water" type="range" min="0" max="100" value="38" aria-label="Water">
      </label>
      <label class="field">
        <span class="field-head"><span>Brush size</span><span class="value" id="sizeValue">56 px</span></span>
        <input id="size" type="range" min="8" max="120" value="56" aria-label="Brush size">
      </label>
    </section>

    <section>
      <div class="section-title"><span>Edge</span><span class="value" id="edgeValue">Soft</span></div>
      <div class="edge-row" role="group" aria-label="Edge style">
        <button class="edge-button" data-edge="soft" type="button" aria-label="Soft edge" aria-pressed="true" title="Soft edge">
          <svg viewBox="0 0 32 18" aria-hidden="true"><path d="M3 10c4-6 7 6 12 0 5-6 8 6 14 0"/></svg>
        </button>
        <button class="edge-button" data-edge="wave" type="button" aria-label="Wave edge" aria-pressed="false" title="Wave edge">
          <svg viewBox="0 0 32 18" aria-hidden="true"><path d="M3 11c4-4 7 4 12 0 5-4 8 4 14 0"/></svg>
        </button>
        <button class="edge-button" data-edge="dry" type="button" aria-label="Dry edge" aria-pressed="false" title="Dry edge">
          <svg viewBox="0 0 32 18" aria-hidden="true"><path d="M3 9c3-2 5 2 8 0m4 0c3-2 5 2 8 0m3 0h3"/></svg>
        </button>
      </div>
    </section>

    <section>
      <div class="section-title"><span>Symmetry</span><span class="value" id="symmetryValue">8</span></div>
      <label class="field">
        <input id="symmetry" type="range" min="1" max="16" value="8" aria-label="Symmetry">
      </label>
      <div class="chip-row">
        <button class="chip" id="mirror" type="button" aria-label="Mirror" aria-pressed="true" title="Mirror (M)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16"/><path d="M4 8l6 4-6 4V8Z"/><path d="M20 8l-6 4 6 4V8Z"/></svg>
          Mirror
        </button>
        <button class="chip" id="randomize" type="button" aria-label="Randomize settings" title="Randomize">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
          Random
        </button>
      </div>
    </section>
  </aside>

  <div class="status" id="status" hidden role="status" aria-live="polite"></div>

  <script>
    (() => {
      const stage = document.getElementById("stage");
      const canvas = document.getElementById("art");
      const ctx = canvas.getContext("2d", { alpha: false });
      const stampCanvas = document.createElement("canvas");
      const stampCtx = stampCanvas.getContext("2d", { alpha: true });

      const ui = {
        undo: document.getElementById("undo"),
        redo: document.getElementById("redo"),
        clear: document.getElementById("clear"),
        export: document.getElementById("export"),
        brushList: document.getElementById("brushList"),
        pigmentRow: document.getElementById("pigmentRow"),
        pigmentValue: document.getElementById("pigmentValue"),
        density: document.getElementById("density"),
        densityValue: document.getElementById("densityValue"),
        water: document.getElementById("water"),
        waterValue: document.getElementById("waterValue"),

        pigment: "sumi",
        custom: null,

      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      const rand = (min, max) => min + Math.random() * (max - min);
      const reducedMotion = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : { matches: false };

      function hexToRgb(hex) {
        const raw = String(hex || "").replace("#", "");
        const full = raw.length === 3 ? raw.split("").map((c) => c + c).join("") : raw.padEnd(6, "0").slice(0, 6);
        return [0, 2, 4].map((i) => clamp(parseInt(full.slice(i, i + 2), 16) || 0, 0, 255));
      }

      function customPigment(hex) {
        const base = hexToRgb(hex);
        return {
          name: "Custom",
          deep: base.map((v) => Math.round(v * 0.52)),
          wash: base.map((v) => Math.round(v + (255 - v) * 0.24))
        };
      }

      function activePigment() {
        if (state.pigment === "custom" && state.custom) return state.custom;
        return pigments[state.pigment] || pigments.sumi;
      }

      // Maps the grayscale "shade" (8 = dense core, 46 = faint halo) onto the
      // active pigment's deep -> wash tone ramp. Water pushes tones toward the
      // lighter, more chromatic wash anchor so dilution reads as a transparent tint.
      const inkColor = (alpha, shade = 14) => {
        const pig = activePigment();
        const tone = clamp(((shade - 8) / 38) * (0.78 + state.water * 0.3), 0, 1);
        const r = Math.round(pig.deep[0] + (pig.wash[0] - pig.deep[0]) * tone);
        const g = Math.round(pig.deep[1] + (pig.wash[1] - pig.deep[1]) * tone);
        const b = Math.round(pig.deep[2] + (pig.wash[2] - pig.deep[2]) * tone);
        return `rgba(${r}, ${g}, ${b}, ${clamp(alpha, 0, 1)})`;
      };

      const wetRgba = (rgb, alpha) => `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${clamp(alpha, 0, 1)})`;

      function hashUnit(x, y = 0, seed = state.paperSeed) {
        const value = Math.sin(x * 127.1 + y * 311.7 + seed * 74.7) * 43758.5453123;
        return value - Math.floor(value);
      }

      function lerpAngle(from, to, amount) {
        const delta = Math.atan2(Math.sin(to - from), Math.cos(to - from));
        return from + delta * amount;
      }

      // ---- Brush rail with live canvas previews ---------------------------

      function createBrushControls() {
        ui.brushList.innerHTML = "";
        brushOrder.forEach((id, index) => {
          const profile = brushProfiles[id];
          const button = document.createElement("button");

          button.dataset.brush = id;

          button.setAttribute("aria-pressed", "false");
          const preview = document.createElement("canvas");
          preview.className = "brush-preview";
          preview.setAttribute("aria-hidden", "true");
          const caption = document.createElement("span");
          caption.className = "brush-caption";
          caption.innerHTML = `<span class="brush-name">${profile.name}<em>${profile.hint}</em></span><kbd>${index + 1}</kbd>`;
          button.append(preview, caption);
          button.addEventListener("click", () => setBrush(id));
          ui.brushList.append(button);
        });
      }

      function previewPath(t, w, h) {
        return {
          x: w * 0.08 + t * w * 0.84,
          y: h * 0.52 + Math.sin(t * Math.PI * 1.7 - 0.5) * h * 0.2
        };
      }

      function paintBrushPreview(preview, kind) {
        const dpr = clamp(window.devicePixelRatio || 1, 1, 2);
        const w = Math.max(60, Math.round(preview.clientWidth || 180));
        const h = Math.max(24, Math.round(preview.clientHeight || 40));
        preview.width = w * dpr;
        preview.height = h * dpr;
        const p = preview.getContext("2d");
        p.setTransform(dpr, 0, 0, dpr, 0, 0);
        p.clearRect(0, 0, w, h);
        const pig = activePigment();
        const deep = (a) => wetRgba(pig.deep, a);
        const wash = (a) => wetRgba(pig.wash, a);
        const steps = 26;
        p.lineCap = "round";
        p.lineJoin = "round";

        if (kind === "sumi") {
          for (let i = 0; i < steps; i += 1) {
            const a = previewPath(i / steps, w, h);
            const b = previewPath((i + 1) / steps, w, h);
            const bell = Math.sin(((i + 0.5) / steps) * Math.PI);
            p.strokeStyle = deep(0.66 + bell * 0.24);
            p.lineWidth = 1 + bell * h * 0.34;
            p.beginPath();
            p.moveTo(a.x, a.y);
            p.lineTo(b.x, b.y);
            p.stroke();
          }
        } else if (kind === "hake") {
          for (let lane = 0; lane < 6; lane += 1) {
            const offset = (lane / 5 - 0.5) * h * 0.56;
            p.strokeStyle = lane % 2 ? wash(0.8) : deep(0.42 + hashUnit(lane, 2, 7) * 0.3);
            p.lineWidth = 1.6;
            p.beginPath();
            for (let i = 0; i <= steps; i += 1) {
              const pt = previewPath(i / steps, w, h);
              if (i === 0) p.moveTo(pt.x, pt.y + offset);
              else p.lineTo(pt.x, pt.y + offset);
            }
            p.stroke();
          }
        } else if (kind === "mop") {
          p.filter = "blur(2px)";
          p.strokeStyle = wash(0.55);
          p.lineWidth = h * 0.62;
          p.beginPath();
          for (let i = 0; i <= steps; i += 1) {
            const pt = previewPath(i / steps, w, h);
            if (i === 0) p.moveTo(pt.x, pt.y);
            else p.lineTo(pt.x, pt.y);
          }
          p.stroke();
          p.filter = "none";
          p.strokeStyle = deep(0.2);
          p.lineWidth = h * 0.2;
          p.stroke();
        } else if (kind === "reed") {
          const ex = Math.cos(-0.66) * h * 0.3;
          const ey = Math.sin(-0.66) * h * 0.3;
          p.fillStyle = deep(0.88);
          for (let i = 0; i < steps; i += 1) {
            const a = previewPath(i / steps, w, h);
            const b = previewPath((i + 1) / steps, w, h);
            p.beginPath();
            p.moveTo(a.x - ex, a.y - ey);
            p.lineTo(a.x + ex, a.y + ey);
            p.lineTo(b.x + ex, b.y + ey);
            p.lineTo(b.x - ex, b.y - ey);
            p.closePath();
            p.fill();
          }
        } else if (kind === "nib") {
          p.strokeStyle = deep(0.9);
          p.lineWidth = 1.3;
          p.beginPath();
          for (let i = 0; i <= steps; i += 1) {
            const pt = previewPath(i / steps, w, h);
            if (i === 0) p.moveTo(pt.x, pt.y);
            else p.lineTo(pt.x, pt.y);
          }
          p.stroke();
          p.strokeStyle = deep(0.34);
          p.lineWidth = 0.8;
          p.beginPath();
          for (let i = 0; i <= steps; i += 1) {
            const pt = previewPath(i / steps, w, h);
            if (i === 0) p.moveTo(pt.x, pt.y + 2.4);
            else p.lineTo(pt.x, pt.y + 2.4);
          }
          p.stroke();
        } else if (kind === "dry") {
          for (let lane = 0; lane < 8; lane += 1) {
            const offset = (lane / 7 - 0.5) * h * 0.5;
            p.strokeStyle = deep(0.4 + hashUnit(lane, 3, 11) * 0.4);
            p.lineWidth = 1.1;
            p.setLineDash([3 + hashUnit(lane, 4, 11) * 6, 3 + hashUnit(lane, 5, 11) * 5]);
            p.lineDashOffset = hashUnit(lane, 6, 11) * 9;
            p.beginPath();
            for (let i = 0; i <= steps; i += 1) {
              const pt = previewPath(i / steps, w, h);
              if (i === 0) p.moveTo(pt.x, pt.y + offset);
              else p.lineTo(pt.x, pt.y + offset);
            }
            p.stroke();
          }
          p.setLineDash([]);
        } else if (kind === "flick") {
          for (let i = 0; i < 22; i += 1) {
            const t = hashUnit(i, 8, 13);
            const pt = previewPath(t, w, h);
            const r = 0.7 + hashUnit(i, 9, 13) * 2.6;
            p.fillStyle = deep(0.28 + hashUnit(i, 10, 13) * 0.6);
            p.beginPath();
            p.ellipse(
              pt.x + (hashUnit(i, 11, 13) - 0.5) * 14,
              pt.y + (hashUnit(i, 12, 13) - 0.5) * h * 0.7,
              r * 1.4,
              r * 0.8,
              hashUnit(i, 13, 13) * Math.PI,
              0,
              Math.PI * 2
            );
            p.fill();
          }
        } else if (kind === "drip") {
          [[0.3, 0.9], [0.62, 0.62], [0.84, 0.42]].forEach(([t, scale], i) => {
            const pt = previewPath(t, w, h);
            const radius = h * 0.42 * scale;
            const gradient = p.createRadialGradient(pt.x, pt.y, radius * 0.1, pt.x, pt.y, radius);
            gradient.addColorStop(0, wash(0.16));
            gradient.addColorStop(0.72, wash(0.44));
            gradient.addColorStop(1, wash(0));
            p.fillStyle = gradient;
            p.beginPath();
            p.arc(pt.x, pt.y, radius, 0, Math.PI * 2);
            p.fill();
            p.strokeStyle = deep(0.24);
            p.lineWidth = 0.9;
            p.beginPath();
            p.arc(pt.x, pt.y, radius * 0.86, hashUnit(i, 14, 17) * 6, hashUnit(i, 14, 17) * 6 + 4.2);
            p.stroke();
          });
        }
      }

      // ---- Paper ------------------------------------------------------

      function makePaperNoise(width = state.width, height = state.height) {
        const gridWidth = 180;
        const gridHeight = 180;
        const data = new Uint8Array(gridWidth * gridHeight);

        for (let y = 0; y < gridHeight; y += 1) {
          for (let x = 0; x < gridWidth; x += 1) {
            const shortFiber = hashUnit(x * 0.9, y * 2.7, state.paperSeed);
            const longFiber = hashUnit(Math.floor(x / 5), y * 0.42, state.paperSeed + 19);
            const cloud = hashUnit(x * 0.2, y * 0.2, state.paperSeed + 41);
            const value = clamp(0.52 + (shortFiber - 0.5) * 0.34 + (longFiber - 0.5) * 0.22 + (cloud - 0.5) * 0.16, 0, 1);
            data[y * gridWidth + x] = Math.round(value * 255);
          }
        }

        state.paperNoise = { width, height, gridWidth, gridHeight, data };
        return state.paperNoise;
      }

      function paperAbsorbency(x, y) {
        const paper = state.paperNoise || makePaperNoise();
        const nx = clamp(Math.floor((x / Math.max(1, paper.width)) * paper.gridWidth), 0, paper.gridWidth - 1);
        const ny = clamp(Math.floor((y / Math.max(1, paper.height)) * paper.gridHeight), 0, paper.gridHeight - 1);
        return paper.data[ny * paper.gridWidth + nx] / 255;
      }

      // --- Wet layer -------------------------------------------------------
      // Fresh marks register bounded wet regions. While a region is wet, a
      // requestAnimationFrame loop feathers diluted pigment outward along the
      // paper-absorbency field; when it dries, pigment settles into a darker,
      // broken rim plus granulation. settleWet() fast-forwards every pending
      // region so history snapshots, undo/redo, export, and resize always see
      // the final dried pixels. An empty wet list costs zero CPU.

      function drawWetPass(region, fromP, toP) {
        const dp = toP - fromP;
        if (dp <= 0) return;
        const eased = 1 - (1 - toP) * (1 - toP);
        const radius = region.r * (1 + region.grow * eased);
        const absorb = paperAbsorbency(region.x, region.y);
        const bandAlpha = clamp(region.alpha * dp * (0.9 + absorb * 0.8), 0, 0.5);

        ctx.save();
        ctx.globalCompositeOperation = "multiply";

        const bloom = ctx.createRadialGradient(region.x, region.y, radius * 0.22, region.x, region.y, radius);
        bloom.addColorStop(0, wetRgba(region.wash, bandAlpha * 0.38));
        bloom.addColorStop(0.52, wetRgba(region.wash, bandAlpha * 0.46));
        bloom.addColorStop(1, wetRgba(region.wash, 0));
        ctx.fillStyle = bloom;
        ctx.beginPath();
        ctx.arc(region.x, region.y, radius, 0, Math.PI * 2);
        ctx.fill();

        for (let i = 0; i < 4; i += 1) {
          const angle = hashUnit(i, 3, region.seed) * Math.PI * 2;
          const reach = radius * (0.82 + hashUnit(i, 4, region.seed) * 0.3);
          const fx = region.x + Math.cos(angle) * reach;
          const fy = region.y + Math.sin(angle) * reach;
          const feed = paperAbsorbency(fx, fy);
          if (feed < 0.45) continue;
          ctx.fillStyle = wetRgba(region.wash, bandAlpha * feed * 0.55);
          ctx.beginPath();
          ctx.ellipse(fx, fy, radius * (0.1 + feed * 0.12), radius * 0.08, angle, 0, Math.PI * 2);
          ctx.fill();
        }

        if (toP >= 1) {
          const rimAlpha = clamp(region.alpha * (0.34 + absorb * 0.4), 0, 0.34);
          ctx.lineCap = "round";
          for (let i = 0; i < 3; i += 1) {
            const start = hashUnit(i, 7, region.seed) * Math.PI * 2;
            const span = Math.PI * (0.42 + hashUnit(i, 8, region.seed) * 0.66);
            const rimRadius = radius * (0.94 + (hashUnit(i, 9, region.seed) - 0.5) * 0.06);
            ctx.strokeStyle = wetRgba(region.deep, rimAlpha * (0.5 + hashUnit(i, 10, region.seed) * 0.5));
            ctx.lineWidth = Math.max(0.7, radius * (0.028 + hashUnit(i, 12, region.seed) * 0.03));
            ctx.beginPath();
            ctx.arc(region.x, region.y, rimRadius, start, start + span);
            ctx.stroke();
          }
          const grains = 2 + Math.round(absorb * 4);
          for (let i = 0; i < grains; i += 1) {
            const angle = hashUnit(i, 15, region.seed) * Math.PI * 2;
            const dist = radius * hashUnit(i, 16, region.seed);
            const gx = region.x + Math.cos(angle) * dist;
            const gy = region.y + Math.sin(angle) * dist;
            ctx.fillStyle = wetRgba(region.deep, region.alpha * 0.16 * paperAbsorbency(gx, gy));
            ctx.beginPath();
            ctx.arc(gx, gy, Math.max(0.5, region.r * 0.045 * (0.5 + hashUnit(i, 17, region.seed))), 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.restore();
      }

      function wetTick(now) {
        state.wetRaf = 0;
        if (state.wet.length === 0) return;
        const survivors = [];
        for (const region of state.wet) {
          const p = clamp((now - region.born) / region.life, 0, 1);
          if (p >= 1) {
            drawWetPass(region, region.p, 1);
          } else {
            if (p - region.p >= 0.055) {
              drawWetPass(region, region.p, p);
              region.p = p;
            }
            survivors.push(region);
          }
        }
        state.wet = survivors;
        if (state.wet.length > 0) state.wetRaf = window.requestAnimationFrame(wetTick);
      }

      function scheduleWet() {
        if (!state.wetRaf && state.wet.length > 0) {
          state.wetRaf = window.requestAnimationFrame(wetTick);
        }
      }

      function settleWet() {
        if (state.wetRaf) {
          window.cancelAnimationFrame(state.wetRaf);
          state.wetRaf = 0;
        }
        if (state.wet.length === 0) return;
        state.wet.forEach((region) => {
          let previous = region.p;
          for (let step = 1; step <= 3; step += 1) {
            const next = previous + (1 - previous) / (4 - step);
            drawWetPass(region, previous, next);
            previous = next;
          }
        });
        state.wet = [];
      }

      function queueWet(x, y, radius, alpha, kindWet) {
        const stampIndex = state.stroke ? state.stroke.stamps : 0;
        if (stampIndex % 2 === 1) return;
        const wetness = clamp(state.water * kindWet * (state.edge === "dry" ? 0.45 : 1), 0, 1.3);
        if (wetness < 0.06 || alpha < 0.02 || radius < 1.5) return;
        if (x < -radius || y < -radius || x > state.width + radius || y > state.height + radius) return;
        const seed = (state.stroke ? state.stroke.seed : state.paperSeed) + stampIndex * 31 + Math.floor(x * 0.7 + y * 1.3);
        const region = {
          x,
          y,
          r: radius,
          grow: 0.34 + wetness * 1.05,
          alpha: clamp(alpha * (0.3 + wetness * 0.55), 0, 0.55),
          deep: activePigment().deep,
          wash: activePigment().wash,
          born: performance.now(),
          life: 460 + wetness * 1800 * (0.75 + hashUnit(stampIndex, 91, seed) * 0.5),
          seed,
          p: 0
        };
        if (reducedMotion.matches) {
          drawWetPass(region, 0, 1);
          return;
        }
        if (state.wet.length >= 320) {
          const oldest = state.wet.shift();
          drawWetPass(oldest, oldest.p, 1);
        }
        state.wet.push(region);
        scheduleWet();
      }

      function drawPaper(targetCtx = ctx, width = state.width, height = state.height) {
        if (targetCtx === ctx && (!state.paperNoise || state.paperNoise.width !== width || state.paperNoise.height !== height)) {
          makePaperNoise(width, height);
        }

        targetCtx.globalCompositeOperation = "source-over";
        const gradient = targetCtx.createRadialGradient(width / 2, height / 2, 0, width / 2, height / 2, Math.max(width, height) * 0.7);
        gradient.addColorStop(0, "rgb(253, 252, 247)");
        gradient.addColorStop(0.76, "rgb(244, 242, 233)");
        gradient.addColorStop(1, "rgb(232, 229, 216)");
        targetCtx.fillStyle = gradient;
        targetCtx.fillRect(0, 0, width, height);

        const paper = state.paperNoise;
        if (paper && targetCtx === ctx) {
          targetCtx.save();
          targetCtx.globalCompositeOperation = "multiply";
          for (let i = 0; i < 1300; i += 1) {
            const x = hashUnit(i, 11, state.paperSeed) * width;
            const y = hashUnit(i, 23, state.paperSeed) * height;
            const absorb = paperAbsorbency(x, y);
            const length = (2 + hashUnit(i, 37, state.paperSeed) * 16) * state.dpr;
            const alpha = 0.012 + absorb * 0.026;
            targetCtx.strokeStyle = `rgba(42, 38, 28, ${alpha})`;
            targetCtx.lineWidth = Math.max(0.35, state.dpr * 0.42);
            targetCtx.beginPath();
            targetCtx.moveTo(x, y);
            targetCtx.lineTo(x + length, y + (hashUnit(i, 53, state.paperSeed) - 0.5) * state.dpr * 2.4);
            targetCtx.stroke();
          }
          targetCtx.restore();
        }

        targetCtx.save();
        targetCtx.translate(width / 2, height / 2);
        targetCtx.strokeStyle = "rgba(35, 34, 30, 0.085)";
        targetCtx.lineWidth = Math.max(1, state.dpr);
        targetCtx.setLineDash([5 * state.dpr, 8 * state.dpr]);
        targetCtx.beginPath();
        targetCtx.moveTo(-width * 0.42, 0);
        targetCtx.lineTo(width * 0.42, 0);
        targetCtx.moveTo(0, -height * 0.42);
        targetCtx.lineTo(0, height * 0.42);
        targetCtx.stroke();

        targetCtx.setLineDash([]);
        targetCtx.strokeStyle = "rgba(35, 34, 30, 0.055)";
        for (let i = 0; i < 8; i += 1) {
          const angle = (Math.PI * 2 * i) / 8;
          targetCtx.beginPath();
          targetCtx.moveTo(0, 0);
          targetCtx.lineTo(Math.cos(angle) * width * 0.34, Math.sin(angle) * width * 0.34);
          targetCtx.stroke();
        }
        [0.18, 0.31].forEach((radius) => {
          targetCtx.beginPath();
          targetCtx.arc(0, 0, Math.min(width, height) * radius, 0, Math.PI * 2);
          targetCtx.stroke();
        });
        targetCtx.restore();
      }

      // ---- History ------------------------------------------------------

      function makeSnapshot() {
        const shot = document.createElement("canvas");
        shot.width = canvas.width;
        shot.height = canvas.height;
        shot.getContext("2d").drawImage(canvas, 0, 0);
        return shot;
      }

      function restoreSnapshot(shot) {
        if (!shot) return;
        ctx.globalCompositeOperation = "source-over";
        drawPaper();
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(shot, 0, 0, shot.width, shot.height, 0, 0, state.width, state.height);
      }

      function pushHistory() {
        settleWet();
        state.history.push(makeSnapshot());
        if (state.history.length > 14) state.history.shift();
        state.redo = [];
        updateUi();
      }

      function resize() {
        settleWet();
        const previous = canvas.width && canvas.height ? makeSnapshot() : null;
        state.dpr = clamp(window.devicePixelRatio || 1, 1, 2);
        state.width = Math.max(1, Math.floor(stage.clientWidth * state.dpr));
        state.height = Math.max(1, Math.floor(stage.clientHeight * state.dpr));
        state.cx = state.width / 2;
        state.cy = state.height / 2;
        canvas.width = state.width;
        canvas.height = state.height;
        if (previous) restoreSnapshot(previous);
        else drawPaper();
        renderBrushPreviews();
        updateUi();
      }

      // ---- Geometry helpers -----------------------------------------------

      function rotateAroundCenter(x, y, angle) {
        const dx = x - state.cx;
        const dy = y - state.cy;
        const ca = Math.cos(angle);
        const sa = Math.sin(angle);
        return [state.cx + dx * ca - dy * sa, state.cy + dx * sa + dy * ca];
      }

      function makeBrushMask(profile, size, seed) {
        const bristles = [];
        const count = Math.max(4, profile.bristles);
        for (let i = 0; i < count; i += 1) {
          const lane = count === 1 ? 0 : i / (count - 1);
          const offsetNoise = hashUnit(i, 1, seed) - 0.5;
          bristles.push({
            offset: (lane - 0.5) * size * 0.92 + offsetNoise * size * 0.08,
            length: size * (0.36 + hashUnit(i, 2, seed) * 0.84),
            width: Math.max(0.45 * state.dpr, size * (0.009 + hashUnit(i, 3, seed) * 0.026)),
            opacity: 0.45 + hashUnit(i, 4, seed) * 0.55,
            lift: hashUnit(i, 5, seed)
          });
        }
        return { bristles, seed, size };
      }

      function resetStampBuffer(diameter) {
        const dimension = Math.max(8, Math.ceil(diameter));
        if (stampCanvas.width !== dimension || stampCanvas.height !== dimension) {
          stampCanvas.width = dimension;
          stampCanvas.height = dimension;
        } else {
          stampCtx.clearRect(0, 0, dimension, dimension);
        }
        stampCtx.setTransform(1, 0, 0, 1, 0, 0);
        stampCtx.globalAlpha = 1;
        stampCtx.globalCompositeOperation = "source-over";
        stampCtx.filter = "none";
        stampCtx.clearRect(0, 0, dimension, dimension);
        return dimension;
      }

      function paintStampBuffer(x, y, angle) {
        ctx.save();
        ctx.globalCompositeOperation = "multiply";
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.drawImage(stampCanvas, -stampCanvas.width / 2, -stampCanvas.height / 2);
        ctx.restore();
      }

      function offsetPoint(point, angle, distance) {
        const normal = angle + Math.PI / 2;
        return {
          x: point.x + Math.cos(normal) * distance,
          y: point.y + Math.sin(normal) * distance
        };
      }

      function drawLinePass(from, to, width, alpha, shade, cap = "round", blur = 0) {
        if (alpha <= 0.002 || width <= 0) return;
        ctx.save();
        ctx.globalCompositeOperation = "multiply";
        ctx.filter = blur > 0.3 ? `blur(${blur}px)` : "none";
        ctx.strokeStyle = inkColor(alpha, shade);
        ctx.lineWidth = width;
        ctx.lineCap = cap;
        ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(from.x, from.y);
        ctx.lineTo(to.x, to.y);
        ctx.stroke();
        ctx.restore();
      }

      function segmentInkAlpha(profile, point, pressure) {
        const absorb = paperAbsorbency(point.x, point.y);
        const load = state.stroke ? state.stroke.reservoir : 1;
        return profile.opacity * state.density * clamp(pressure, 0.18, 1) * load * (0.84 + absorb * 0.28);
      }

      // ---- Brush renderers --------------------------------------------------

      // Sumi: pointed calligraphy brush. Width tapers with reservoir load and
      // pressure; fast strokes lift bristles off the paper ("flying white").
      function drawContinuousSumiSegment(from, to, angle, pressure, speed) {
        const profile = brushProfiles.sumi;
        const mid = { x: (from.x + to.x) / 2, y: (from.y + to.y) / 2 };
        const load = state.stroke ? state.stroke.reservoir : 1;
        const size = state.size * state.dpr * profile.sizeScale;
        const alpha = segmentInkAlpha(profile, mid, pressure);
        const taper = 0.55 + load * 0.45;
        const width = size * (0.34 + pressure * 0.28) * (1.05 - clamp(speed, 0, 1.7) * 0.1) * taper;
        const flyingWhite = Math.max(0, speed - 1.2) * 0.4;
        const edgeWave = state.edge === "wave" ? Math.sin((state.stroke?.stamps || 0) * 0.65 + state.paperSeed) * width * 0.06 : 0;

        if (state.water > 0.18) {
          drawLinePass(from, to, width * (1.22 + state.water * 0.52), alpha * (0.07 + state.water * 0.12), 34, "round", width * (0.025 + state.water * 0.035));
        }
        drawLinePass(from, to, width * (0.82 + edgeWave / Math.max(1, width)), alpha * 0.58 * (1 - flyingWhite * 0.6), 10, "round");
        drawLinePass(from, to, width * 0.28, alpha * (0.56 + (1 - speed) * 0.12), 7, "round");

        const mask = state.stroke?.mask || makeBrushMask(profile, size, state.paperSeed);
        mask.bristles.forEach((bristle, index) => {
          if (index % 2 && hashUnit(index, state.stroke?.stamps || 0, mask.seed) < 0.36 + flyingWhite) return;
          const laneOffset = clamp(bristle.offset * 0.34 + edgeWave, -width * 0.48, width * 0.48);
          const laneFrom = offsetPoint(from, angle, laneOffset);
          const laneTo = offsetPoint(to, angle, laneOffset + (hashUnit(index, 61, mask.seed) - 0.5) * width * 0.08);
          const absorb = paperAbsorbency(laneTo.x, laneTo.y);
          if (state.edge === "dry" && hashUnit(index, state.stroke?.stamps || 0, mask.seed) > absorb + 0.52) return;
          const laneWidth = Math.max(0.5 * state.dpr, bristle.width * (1.8 + pressure * 1.4));
          drawLinePass(laneFrom, laneTo, laneWidth, alpha * bristle.opacity * (0.22 + load * 0.18), 12, "butt");
        });

        if (state.edge !== "soft") drawSplatter(to.x, to.y, angle, pressure, speed, load);
        queueWet(mid.x, mid.y, width * 0.62, alpha, profile.wet);
      }

      // Hake: wide flat wash brush. A translucent body band plus individually
      // starved bristle streaks across the full width, with crisp rails at the
      // two edges of the flat.
      function drawContinuousHakeSegment(from, to, angle, pressure, speed) {
        const profile = brushProfiles.hake;
        const mid = { x: (from.x + to.x) / 2, y: (from.y + to.y) / 2 };
        const load = state.stroke ? state.stroke.reservoir : 1;
        const size = state.size * state.dpr * profile.sizeScale;
        const alpha = segmentInkAlpha(profile, mid, pressure);
        const width = size * (0.82 + pressure * 0.22);
        const mask = state.stroke?.mask || makeBrushMask(profile, size, state.paperSeed);
        const stampIndex = state.stroke?.stamps || 0;

        drawLinePass(from, to, width, alpha * 0.18, 30, "butt", width * 0.015);
        drawLinePass(from, to, width * 0.88, alpha * 0.15, 22, "butt");

        const lanes = 12;
        for (let i = 0; i < lanes; i += 1) {
          const t = i / (lanes - 1);
          const laneOffset = (t - 0.5) * width * 0.94 + (hashUnit(i, 5, mask.seed) - 0.5) * width * 0.05;
          const laneFrom = offsetPoint(from, angle, laneOffset);
          const laneTo = offsetPoint(to, angle, laneOffset + (hashUnit(i, 6, mask.seed) - 0.5) * width * 0.04);
          const absorb = paperAbsorbency(laneTo.x, laneTo.y);
          const starve = state.edge === "dry" ? 0.34 : 0.1;
          if (hashUnit(i, stampIndex, mask.seed) < starve * (1.2 - absorb) + (1 - load) * 0.2) continue;
          const laneWidth = Math.max(0.6 * state.dpr, width * (0.028 + hashUnit(i, 7, mask.seed) * 0.05));
          const laneShade = 10 + Math.round(hashUnit(i, 8, mask.seed) * 14);
          drawLinePass(laneFrom, laneTo, laneWidth, alpha * (0.3 + hashUnit(i, 9, mask.seed) * 0.3) * load, laneShade, "butt");
        }

        [-1, 1].forEach((side) => {
          const railFrom = offsetPoint(from, angle, side * width * 0.48);
          const railTo = offsetPoint(to, angle, side * width * 0.48);
          drawLinePass(railFrom, railTo, Math.max(0.6 * state.dpr, width * 0.02), alpha * 0.24, 14, "butt");
        });

        if (state.edge !== "soft") drawSplatter(to.x, to.y, angle, pressure, speed, load * 0.4);
        queueWet(mid.x, mid.y, width * 0.55, alpha * 1.4, profile.wet);
      }

      // Mop: water-soaked wash brush with soft diffuse body and heavy blooms.
      function drawContinuousMopSegment(from, to, angle, pressure, speed) {
        const profile = brushProfiles.mop;
        const mid = { x: (from.x + to.x) / 2, y: (from.y + to.y) / 2 };
        const load = state.stroke ? state.stroke.reservoir : 1;
        const size = state.size * state.dpr * profile.sizeScale;
        const alpha = segmentInkAlpha(profile, mid, pressure);
        const width = size * (0.74 + state.water * 0.56 + pressure * 0.16);
        const blur = width * (0.035 + state.water * 0.04);

        drawLinePass(from, to, width * 1.24, alpha * (0.16 + state.water * 0.12), 44, "round", blur);
        drawLinePass(from, to, width * 0.78, alpha * 0.2, 34, "round", blur * 0.55);
        drawLinePass(from, to, width * 0.2, alpha * 0.14, 22, "round");

        const edgeAlpha = alpha * (0.12 + state.water * 0.16);
        [-1, 1].forEach((side) => {
          const offset = side * width * (0.38 + state.water * 0.08);
          const edgeFrom = offsetPoint(from, angle, offset);
          const edgeTo = offsetPoint(to, angle, offset + Math.sin((state.stroke?.stamps || 0) * 0.5 + side) * width * 0.025);
          drawLinePass(edgeFrom, edgeTo, Math.max(0.8 * state.dpr, width * 0.045), edgeAlpha, 18, "round", blur * 0.24);
        });

        const mask = state.stroke?.mask || makeBrushMask(profile, size, state.paperSeed);
        mask.bristles.forEach((bristle, index) => {
          if (index % 3 === 0) return;
          const laneOffset = clamp(bristle.offset * 0.48, -width * 0.46, width * 0.46);
          const laneFrom = offsetPoint(from, angle, laneOffset);
          const laneTo = offsetPoint(to, angle, laneOffset + (hashUnit(index, 71, mask.seed) - 0.5) * width * 0.1);
          const absorb = paperAbsorbency(laneTo.x, laneTo.y);
          const skip = state.edge === "dry" ? 0.26 : 0.08;
          if (hashUnit(index, state.stroke?.stamps || 0, mask.seed) < skip * (1 - absorb)) return;
          drawLinePass(laneFrom, laneTo, Math.max(0.65 * state.dpr, bristle.width * 2.1), alpha * bristle.opacity * 0.1 * load, 38, "round", blur * 0.18);
        });

        if (state.edge !== "soft") drawSplatter(to.x, to.y, angle, pressure, speed, load * 0.55);
        queueWet(mid.x, mid.y, width * 0.66, alpha * 2.2, profile.wet);
      }

      // Reed pen: rigid chisel edge held at a fixed angle. The ribbon between
      // the two edge corners naturally goes thick and thin as the stroke
      // direction changes; slow passes pool ink at the tip.
      function drawContinuousReedSegment(from, to, angle, pressure, speed) {
        const profile = brushProfiles.reed;
        const mid = { x: (from.x + to.x) / 2, y: (from.y + to.y) / 2 };
        const load = state.stroke ? state.stroke.reservoir : 1;
        const size = state.size * state.dpr * profile.sizeScale;
        const alpha = clamp(segmentInkAlpha(profile, mid, pressure) * 1.08, 0, 1);
        const chisel = -0.66;
        const edgeLength = size * (0.6 + pressure * 0.3);
        const ex = (Math.cos(chisel) * edgeLength) / 2;
        const ey = (Math.sin(chisel) * edgeLength) / 2;

        ctx.save();
        ctx.globalCompositeOperation = "multiply";
        ctx.fillStyle = inkColor(alpha * (0.62 + load * 0.24), 8);
        ctx.beginPath();
        ctx.moveTo(from.x - ex, from.y - ey);
        ctx.lineTo(from.x + ex, from.y + ey);
        ctx.lineTo(to.x + ex, to.y + ey);
        ctx.lineTo(to.x - ex, to.y - ey);
        ctx.closePath();
        ctx.fill();

        if (speed < 0.24) {
          ctx.fillStyle = inkColor(alpha * 0.5, 8);
          ctx.beginPath();
          ctx.ellipse(to.x, to.y, edgeLength * 0.22, edgeLength * 0.13, chisel, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        drawLinePass(
          { x: from.x - ex, y: from.y - ey },
          { x: to.x - ex, y: to.y - ey },
          Math.max(0.7 * state.dpr, size * 0.03),
          alpha * 0.5,
          8,
          "butt"
        );

        if (state.edge !== "soft") drawSplatter(to.x, to.y, angle, pressure, speed, load * 0.5);
        queueWet(mid.x, mid.y, edgeLength * 0.4, alpha * 0.8, profile.wet);
      }

      function drawBloom(x, y, radius, alpha, edgeAlpha = alpha * 0.34) {
        const blur = clamp(radius * (0.06 + state.water * 0.06), 0, 18 * state.dpr);
        ctx.save();
        ctx.globalCompositeOperation = "multiply";
        ctx.filter = blur > 0.4 ? `blur(${blur}px)` : "none";
        const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
        gradient.addColorStop(0, inkColor(alpha * 0.42, 32));
        gradient.addColorStop(0.58, inkColor(alpha * 0.18, 42));
        gradient.addColorStop(1, inkColor(0, 46));
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.filter = "none";
        ctx.strokeStyle = inkColor(edgeAlpha, 18);
        ctx.lineWidth = Math.max(0.75, radius * 0.035);
        ctx.beginPath();
        ctx.arc(x, y, radius * (0.7 + state.water * 0.16), 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      function drawSplatter(x, y, angle, pressure, speed, load) {
        const profile = brushProfiles[state.brush] || brushProfiles.sumi;
        const factor = profile.kind === "flick" ? 1 : state.edge === "dry" ? 0.22 : 0.08;
        if (factor <= 0) return;
        const seed = (state.stroke ? state.stroke.seed + state.stroke.stamps * 17 : state.paperSeed) + Math.floor(x + y);
        const count = Math.round((2 + state.density * 9) * factor * (0.72 + pressure));
        if (count <= 0) return;

        ctx.globalCompositeOperation = "multiply";
        for (let i = 0; i < count; i += 1) {
          const spreadAngle = angle + (hashUnit(i, 6, seed) - 0.5) * Math.PI * (profile.kind === "flick" ? 1.2 : 0.48);
          const sideAngle = spreadAngle + Math.PI / 2;
          const throwDistance = (4 + hashUnit(i, 7, seed) * (state.size * (0.42 + state.water * 0.54))) * state.dpr;
          const along = (hashUnit(i, 8, seed) - 0.5) * state.size * 0.34 * state.dpr;
          const radius = (0.55 + hashUnit(i, 9, seed) * (2.4 + state.size * 0.025)) * state.dpr;
          const alpha = profile.opacity * state.density * load * (0.18 + hashUnit(i, 10, seed) * 0.38);
          ctx.fillStyle = inkColor(alpha, 12);
          ctx.beginPath();
          ctx.ellipse(
            x + Math.cos(sideAngle) * throwDistance + Math.cos(angle) * along,
            y + Math.sin(sideAngle) * throwDistance + Math.sin(angle) * along,
            radius * (1 + speed * 0.9),
            radius * (0.66 + hashUnit(i, 11, seed) * 0.38),
            spreadAngle,
            0,
            Math.PI * 2
          );
          ctx.fill();
        }
      }

      function removeDryGaps(size, seed, amount) {
        stampCtx.save();
        stampCtx.globalCompositeOperation = "destination-out";
        stampCtx.strokeStyle = `rgba(0, 0, 0, ${clamp(amount, 0, 1)})`;
        stampCtx.lineCap = "round";
        for (let i = 0; i < 24; i += 1) {
          const y = stampCanvas.height * hashUnit(i, 21, seed);
          const x = stampCanvas.width * hashUnit(i, 22, seed);
          const length = size * (0.12 + hashUnit(i, 23, seed) * 0.42);
          stampCtx.lineWidth = Math.max(0.8, size * (0.008 + hashUnit(i, 24, seed) * 0.02));
          stampCtx.beginPath();
          stampCtx.moveTo(x - length / 2, y);
          stampCtx.lineTo(x + length / 2, y + (hashUnit(i, 25, seed) - 0.5) * size * 0.08);
          stampCtx.stroke();
        }
        stampCtx.restore();
      }

      function stampNib(x, y, angle, size, alpha, pressure) {
        const width = clamp(size * (0.08 + pressure * 0.12), state.dpr, size * 0.24);
        const length = size * (0.74 + pressure * 0.72);
        const dimension = resetStampBuffer(Math.max(length * 1.35, width * 5.5));
        const center = dimension / 2;
        const railOffset = width * (0.32 + pressure * 0.18);

        stampCtx.lineCap = "butt";
        stampCtx.strokeStyle = inkColor(alpha, 8);
        stampCtx.lineWidth = Math.max(0.8, width * 0.42);
        [-railOffset, railOffset].forEach((offset, index) => {
          stampCtx.beginPath();
          stampCtx.moveTo(center - length / 2, center + offset);
          stampCtx.lineTo(center + length / 2, center + offset + (hashUnit(index, state.stroke?.stamps || 0, state.paperSeed) - 0.5) * width * 0.35);
          stampCtx.stroke();
        });

        if (pressure > 0.62) {
          stampCtx.strokeStyle = inkColor(alpha * 0.24, 12);
          stampCtx.lineWidth = Math.max(0.5, width * 0.18);
          stampCtx.beginPath();
          stampCtx.moveTo(center - length * 0.38, center);
          stampCtx.lineTo(center + length * 0.34, center);
          stampCtx.stroke();
        }

        if (state.edge === "dry") removeDryGaps(size, state.stroke?.seed || state.paperSeed, 0.42);
        paintStampBuffer(x, y, angle);
      }

      function stampDryBrush(x, y, angle, size, alpha, pressure, load) {
        const profile = brushProfiles.dry;
        const dimension = resetStampBuffer(size * 1.82);
        const center = dimension / 2;
        const mask = state.stroke?.mask || makeBrushMask(profile, size, state.paperSeed);
        const stampIndex = state.stroke?.stamps || 0;

        stampCtx.lineCap = "butt";
        mask.bristles.forEach((bristle, index) => {
          const absorb = paperAbsorbency(
            x + Math.cos(angle + Math.PI / 2) * bristle.offset,
            y + Math.sin(angle + Math.PI / 2) * bristle.offset
          );
          const skip = 0.06 + (1 - load) * 0.28 + (1 - absorb) * 0.12 + bristle.lift * 0.08;
          if (hashUnit(index, stampIndex, mask.seed) < skip) return;
          const segment = bristle.length * (0.34 + hashUnit(index, 44, mask.seed) * 0.7);
          const gap = (hashUnit(index, 45, mask.seed) - 0.5) * size * 0.18;
          stampCtx.strokeStyle = inkColor(alpha * bristle.opacity * (0.78 + pressure * 0.32), 9);
          stampCtx.lineWidth = Math.max(0.55 * state.dpr, bristle.width * (0.9 + pressure * 0.8));
          stampCtx.beginPath();
          stampCtx.moveTo(center - segment / 2 + gap, center + bristle.offset * 0.48);
          stampCtx.lineTo(center + segment / 2 + gap, center + bristle.offset * 0.48 + (hashUnit(index, 46, mask.seed) - 0.5) * size * 0.04);
          stampCtx.stroke();
        });

        removeDryGaps(size, state.stroke?.seed || state.paperSeed, 0.54);
        paintStampBuffer(x, y, angle);
      }

      // Water drop: touches clear water to the sheet. Almost no pigment core;
      // instead it feeds the wet layer so surrounding pigment blooms outward.
      function stampWaterDrop(x, y, size, alpha) {
        const radius = size * (0.5 + state.water * 0.45);
        drawBloom(x, y, radius, clamp(alpha * 2.1, 0.04, 0.4), clamp(alpha * 0.9, 0.02, 0.18));
        queueWet(x, y, radius * 0.9, clamp(alpha * 3, 0.1, 0.5), brushProfiles.drip.wet);
      }

      function stampBrush(x, y, angle, pressure, speed) {
        const profile = brushProfiles[state.brush] || brushProfiles.sumi;
        const absorb = paperAbsorbency(x, y);
        const load = state.stroke ? state.stroke.reservoir : 1;
        const baseSize = state.size * state.dpr * profile.sizeScale;
        const pressureAlpha = clamp(pressure, 0.18, 1);
        const absorbAlpha = 0.84 + absorb * 0.28;
        const alpha = profile.opacity * state.density * pressureAlpha * load * absorbAlpha;

        if (alpha <= 0.006) return;

        if (profile.kind === "nib") {
          stampNib(x, y, angle, baseSize, alpha, pressure);
          queueWet(x, y, baseSize * 0.42, alpha, profile.wet);
          return;
        }

        if (profile.kind === "flick") {
          drawSplatter(x, y, angle, pressure, speed, load);
          if (state.water > 0.42) drawBloom(x, y, baseSize * 0.42, alpha * 0.05, alpha * 0.03);
          queueWet(x, y, baseSize * 0.55, alpha, profile.wet);
          return;
        }

        if (profile.kind === "dry") {
          stampDryBrush(x, y, angle, baseSize, alpha, pressure, load);
          queueWet(x, y, baseSize * 0.5, alpha, profile.wet);
          return;
        }

        if (profile.kind === "drip") {
          stampWaterDrop(x, y, baseSize, alpha);
          return;
        }

        // Continuous kinds land here only for isolated taps: paint one short
        // segment so a click still leaves a mark.
        const half = baseSize * 0.14;
        const from = { x: x - Math.cos(angle) * half, y: y - Math.sin(angle) * half };
        const to = { x: x + Math.cos(angle) * half, y: y + Math.sin(angle) * half };
        continuousSegmentPainter(profile.kind)(from, to, angle, pressure, speed);
      }

      function continuousSegmentPainter(kind) {
        if (kind === "hake") return drawContinuousHakeSegment;
        if (kind === "mop") return drawContinuousMopSegment;
        if (kind === "reed") return drawContinuousReedSegment;
        return drawContinuousSumiSegment;
      }

      function drainStroke(profile, pressure) {
        if (!state.stroke) return;
        const waterReturn = 1.12 - state.water * 0.42;
        const minLoad = profile.kind === "dry" ? 0.26 : profile.kind === "mop" ? 0.56 : 0.38;
        state.stroke.reservoir = clamp(state.stroke.reservoir - profile.drain * (0.7 + pressure * 0.55) * waterReturn, minLoad, 1);
        state.stroke.stamps += 1;
      }

      function stampSymmetry(point, angle, pressure, speed) {
        const profile = brushProfiles[state.brush] || brushProfiles.sumi;
        const rotations = Math.max(1, Math.round(state.symmetry));
        const passes = state.mirror ? 2 : 1;

        for (let mirrorIndex = 0; mirrorIndex < passes; mirrorIndex += 1) {
          const sx = mirrorIndex === 0 ? point.x : 2 * state.cx - point.x;
          const markAngle = mirrorIndex === 0 ? angle : Math.PI - angle;
          for (let i = 0; i < rotations; i += 1) {
            const rotation = (Math.PI * 2 * i) / rotations;
            const [rx, ry] = rotateAroundCenter(sx, point.y, rotation);
            stampBrush(rx, ry, markAngle + rotation, pressure, speed);
          }
        }

        drainStroke(profile, pressure);
      }

      function strokeSymmetrySegment(from, to, angle, pressure, speed) {
        const profile = brushProfiles[state.brush] || brushProfiles.sumi;
        const paint = continuousSegmentPainter(profile.kind);
        const rotations = Math.max(1, Math.round(state.symmetry));
        const passes = state.mirror ? 2 : 1;

        for (let mirrorIndex = 0; mirrorIndex < passes; mirrorIndex += 1) {
          const startX = mirrorIndex === 0 ? from.x : 2 * state.cx - from.x;
          const endX = mirrorIndex === 0 ? to.x : 2 * state.cx - to.x;
          for (let i = 0; i < rotations; i += 1) {
            const rotation = (Math.PI * 2 * i) / rotations;
            const [x0, y0] = rotateAroundCenter(startX, from.y, rotation);
            const [x1, y1] = rotateAroundCenter(endX, to.y, rotation);
            const segmentAngle = Math.atan2(y1 - y0, x1 - x0);
            paint({ x: x0, y: y0 }, { x: x1, y: y1 }, segmentAngle, pressure, speed);
          }
        }

        drainStroke(profile, pressure);
      }

      function sampleStrokeSegment(from, to) {
        if (!state.stroke) return;
        const profile = brushProfiles[state.brush] || brushProfiles.sumi;
        const dx = to.x - from.x;
        const dy = to.y - from.y;
        const distance = Math.hypot(dx, dy);
        if (distance < 0.75 * state.dpr) return;

        const elapsed = Math.max(8, to.time - from.time);
        const speed = clamp(distance / elapsed / state.dpr, 0.02, 3.2);
        const rawAngle = Math.atan2(dy, dx);
        state.stroke.angle = lerpAngle(state.stroke.angle, rawAngle, state.stroke.stamps < 2 ? 1 : 0.38);
        const estimatedPressure = clamp((to.pressure || 0.52) + (0.28 - speed * 0.12), 0.18, 1);
        const spacing = clamp(state.size * state.dpr * profile.spacing, 2.2 * state.dpr, 18 * state.dpr);

        if (CONTINUOUS.has(profile.kind)) {
          const pressure = clamp((from.pressure + estimatedPressure) / 2, 0.18, 1);
          const segmentCount = Math.max(1, Math.floor(distance / spacing));
          for (let i = 0; i < segmentCount; i += 1) {
            const t0 = i / segmentCount;
            const t1 = (i + 1) / segmentCount;
            strokeSymmetrySegment(
              { x: from.x + dx * t0, y: from.y + dy * t0 },
              { x: from.x + dx * t1, y: from.y + dy * t1 },
              state.stroke.angle,
              pressure,
              speed
            );
          }
          state.stroke.spacingCarry = (state.stroke.spacingCarry + distance) % spacing;
          return;
        }

        let offset = spacing - state.stroke.spacingCarry;

        while (offset <= distance) {
          const t = offset / distance;
          const point = {
            x: from.x + dx * t,
            y: from.y + dy * t
          };
          const pressure = clamp(from.pressure + (estimatedPressure - from.pressure) * t, 0.18, 1);
          stampSymmetry(point, state.stroke.angle, pressure, speed);
          offset += spacing;
        }

        state.stroke.spacingCarry = (state.stroke.spacingCarry + distance) % spacing;
      }

      // ---- Pointer handling -----------------------------------------------

      function eventPosition(event) {
        const rect = canvas.getBoundingClientRect();
        const pointerPressure = event.pressure && event.pressure > 0 ? event.pressure : 0.54;
        return {
          x: (event.clientX - rect.left) * (canvas.width / rect.width),
          y: (event.clientY - rect.top) * (canvas.height / rect.height),
          pressure: clamp(pointerPressure, 0.18, 1),
          time: event.timeStamp || performance.now()
        };
      }

      function beginStroke(event) {
        if (event.button !== undefined && event.button !== 0) return;
        pushHistory();
        state.painting = true;
        state.pointerId = event.pointerId ?? "mouse";
        const point = eventPosition(event);
        const profile = brushProfiles[state.brush] || brushProfiles.sumi;
        const seed = Math.floor(performance.now() * 10 + point.x * 0.3 + point.y * 0.7);
        const brushSize = state.size * state.dpr * profile.sizeScale;
        state.stroke = {
          brush: state.brush,
          last: point,
          angle: 0,
          spacingCarry: 0,
          reservoir: profile.kind === "dry" ? 0.86 : 1,
          seed,
          stamps: 0,
          mask: makeBrushMask(profile, brushSize, seed)
        };
        state.last = point;
        if (!CONTINUOUS.has(profile.kind)) {
          stampSymmetry(point, 0, point.pressure, 0.04);
        }
        if (event.pointerId !== undefined && stage.setPointerCapture) {
          stage.setPointerCapture(event.pointerId);
        }
        event.preventDefault();
      }

      function continueStroke(event) {
        const pointerId = event.pointerId ?? "mouse";
        if (!state.painting || pointerId !== state.pointerId || !state.stroke) return;
        const point = eventPosition(event);
        sampleStrokeSegment(state.stroke.last, point);
        state.stroke.last = point;
        state.last = point;
        event.preventDefault();
      }

      function endStroke(event) {
        const pointerId = event.pointerId ?? "mouse";
        if (!state.painting || pointerId !== state.pointerId) return;
        const profile = brushProfiles[state.stroke?.brush] || brushProfiles.sumi;
        if (state.stroke?.last && !CONTINUOUS.has(profile.kind)) {
          stampSymmetry(state.stroke.last, state.stroke.angle, state.stroke.last.pressure, 0.04);
        }
        state.painting = false;
        state.pointerId = null;
        state.last = null;
        state.stroke = null;
        updateUi();
      }

      // ---- Actions ------------------------------------------------------

      function setBrush(brush) {
        if (!brushProfiles[brush]) return;
        state.brush = brush;
        updateUi();
      }

      function setEdge(edge) {
        state.edge = edgeLabels[edge] ? edge : "soft";
        updateUi();
      }

      function undo() {
        if (state.history.length === 0) return;
        settleWet();
        state.stroke = null;
        state.redo.push(makeSnapshot());
        restoreSnapshot(state.history.pop());
        updateUi();
      }

      function redo() {
        if (state.redo.length === 0) return;
        settleWet();
        state.stroke = null;
        state.history.push(makeSnapshot());
        restoreSnapshot(state.redo.pop());
        updateUi();
      }

      function clearArt() {
        pushHistory();
        state.stroke = null;
        drawPaper();
        updateUi();
      }

      function showStatus(message) {
        window.clearTimeout(state.statusTimer);
        ui.status.textContent = message;
        ui.status.hidden = false;
        state.statusTimer = window.setTimeout(() => {
          ui.status.hidden = true;
        }, 2200);
      }

      function timestamp() {
        return new Date().toISOString().replace(/[:.]/g, "-");
      }

      function canvasToBlob(sourceCanvas) {
        return new Promise((resolve) => {
          if (sourceCanvas.toBlob) {
            sourceCanvas.toBlob(resolve, "image/png");
            return;
          }
          const dataUrl = sourceCanvas.toDataURL("image/png");
          const binary = atob(dataUrl.split(",")[1] || "");
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i += 1) {
            bytes[i] = binary.charCodeAt(i);
          }
          resolve(new Blob([bytes], { type: "image/png" }));
        });
      }

      async function exportPng() {
        if (state.exporting) return;
        state.exporting = true;
        settleWet();
        updateUi();
        try {
          const blob = await canvasToBlob(canvas);
          if (!blob) throw new Error("PNG export failed");
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.download = `fractal-brushes-ink-${timestamp()}.png`;
          link.href = url;
          document.body.append(link);
          link.click();
          link.remove();
          window.setTimeout(() => URL.revokeObjectURL(url), 0);
          showStatus("PNG export ready.");
        } catch (error) {
          showStatus("Export failed in this browser.");
        } finally {
          state.exporting = false;
          updateUi();
        }
      }

      function randomize() {
        state.brush = brushOrder[Math.floor(Math.random() * brushOrder.length)];
        state.pigment = pigmentOrder[Math.floor(Math.random() * pigmentOrder.length)];
        state.density = rand(0.34, 0.92);
        state.water = rand(0.12, 0.84);
        state.edge = ["soft", "wave", "dry"][Math.floor(Math.random() * 3)];
        state.size = Math.round(rand(18, 108));
        state.symmetry = Math.round(rand(2, 14));
        state.mirror = Math.random() > 0.2;
        updateUi();
      }

      // ---- Wiring ------------------------------------------------------

      stage.addEventListener("pointerdown", beginStroke);
      stage.addEventListener("pointermove", continueStroke);
      window.addEventListener("pointerup", endStroke);
      stage.addEventListener("pointercancel", endStroke);
      stage.addEventListener("pointerleave", endStroke);
      window.addEventListener("resize", resize);

      ui.undo.addEventListener("click", undo);
      ui.redo.addEventListener("click", redo);
      ui.clear.addEventListener("click", clearArt);
      ui.export.addEventListener("click", exportPng);
      ui.mirror.addEventListener("click", () => {
        state.mirror = !state.mirror;
        updateUi();
      });
      ui.randomize.addEventListener("click", randomize);
      ui.density.addEventListener("input", (event) => {
        state.density = Number(event.target.value) / 100;
        updateUi();
      });
      ui.water.addEventListener("input", (event) => {
        state.water = Number(event.target.value) / 100;
        updateUi();
      });
      ui.size.addEventListener("input", (event) => {
        state.size = Number(event.target.value);
        updateUi();
      });
      ui.symmetry.addEventListener("input", (event) => {
        state.symmetry = Number(event.target.value);
        updateUi();
      });
      ui.edgeButtons.forEach((button) => {
        button.addEventListener("click", () => setEdge(button.dataset.edge));
      });

      window.addEventListener("keydown", (event) => {
        const tag = document.activeElement && document.activeElement.tagName;
        if (tag === "INPUT") return;
        const key = event.key.toLowerCase();
        if ((event.metaKey || event.ctrlKey) && key === "z") {
          event.preventDefault();
          if (event.shiftKey) redo();
          else undo();
        } else if ((event.metaKey || event.ctrlKey) && key === "y") {
          event.preventDefault();
          redo();
        } else if (key >= "1" && key <= "8" && !event.metaKey && !event.ctrlKey && !event.altKey) {
          event.preventDefault();
          setBrush(brushOrder[Number(key) - 1]);
        } else if (key === "[") {
          event.preventDefault();
          state.size = clamp(state.size - 6, 8, 120);
          updateUi();
        } else if (key === "]") {
          event.preventDefault();
          state.size = clamp(state.size + 6, 8, 120);
          updateUi();
        } else if (key === "c") {
          event.preventDefault();
          clearArt();
        } else if (key === "m") {
          event.preventDefault();
          state.mirror = !state.mirror;
          updateUi();
        } else if (key === "p") {
          event.preventDefault();
          exportPng();
        }
      });

      createBrushControls();
      createPigmentControls();
      resize();
      updateUi();
      // A heavily parallel browser run can finish the inline setup before the
      // brush rail has its final layout. Repaint once on the definitive load
      // event so the visible canvas previews never remain at their reset state.
      window.addEventListener("load", renderBrushPreviews, { once: true });
    })();
  </script>
</body>
</html>
